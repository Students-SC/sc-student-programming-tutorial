<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">One-hop MPI ring communication on one compute node</title>
  <desc id="desc">Four ranks form a clockwise ring. Rank 0 sends value 0 to rank 1. Rank 1 sends value 1 to rank 2. Rank 2 sends value 2 to rank 3. Rank 3 sends value 3 to rank 0. Each value moves one hop, so each rank receives the previous rank's number.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#2b6cb0"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#ffffff"/>
  <rect x="16" y="16" width="608" height="328" rx="16" fill="#f6f9fc" stroke="#cbd9e9" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="320" y="48" font-size="20" font-weight="700" fill="#07091f">One compute node</text>
    <text x="320" y="73" font-size="14" fill="#25305f">Each value moves one hop</text>
    <g fill="#eff6ff" stroke="#368fd8" stroke-width="2">
      <rect x="94" y="104" width="132" height="64" rx="10"/>
      <rect x="414" y="104" width="132" height="64" rx="10"/>
      <rect x="414" y="224" width="132" height="64" rx="10"/>
      <rect x="94" y="224" width="132" height="64" rx="10"/>
    </g>
    <g font-size="20" font-weight="700" fill="#07091f">
      <text x="160" y="143">Rank 0</text>
      <text x="480" y="143">Rank 1</text>
      <text x="480" y="263">Rank 2</text>
      <text x="160" y="263">Rank 3</text>
    </g>
    <g fill="none" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M 234 136 H 406"/>
      <path d="M 480 176 V 216"/>
      <path d="M 406 256 H 234"/>
      <path d="M 160 216 V 176"/>
    </g>
    <g font-size="14" fill="#25305f">
      <text x="320" y="123">value 0</text>
      <text x="536" y="201">value 1</text>
      <text x="320" y="243">value 2</text>
      <text x="104" y="201">value 3</text>
    </g>
    <text x="320" y="325" font-size="14" fill="#25305f">Each rank receives the previous rank's number.</text>
  </g>
</svg>
